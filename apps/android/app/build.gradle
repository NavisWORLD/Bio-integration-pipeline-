plugins {
    id 'com.android.application'
}

android {
    namespace 'world.navis.cosmosbiocns'
    compileSdk 36

    defaultConfig {
        applicationId 'world.navis.cosmosbiocns'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}
