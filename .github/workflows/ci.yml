name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q src examples tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          cosmos-bio-cns demo --steps 2 --db /tmp/cosmos-bio-cns-ci.sqlite3
          cosmos-bio-cns verify-ledger --db /tmp/cosmos-bio-cns-ci.sqlite3

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Verify wheel payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, got {wheels}"
          required = {
              "cosmos_bio_cns/py.typed",
              "cosmos_bio_cns/schemas/bio_observation.schema.json",
              "cosmos_bio_cns/schemas/heartbeat.schema.json",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              members = set(archive.namelist())
          missing = required - members
          assert not missing, f"wheel missing required package data: {sorted(missing)}"
          print("wheel payload verified")
          PY

      - name: Install built wheel and load packaged schemas
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          from cosmos_bio_cns import load_schema
          assert load_schema("bio_observation")["title"] == "COSMOS Bio Observation"
          assert load_schema("heartbeat")["title"] == "COSMOS Heartbeat Record"
          print("installed wheel schema load verified")
          PY
