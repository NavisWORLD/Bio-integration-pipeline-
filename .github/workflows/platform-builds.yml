name: Platform Builds

on:
  push:
    branches: [main, agent/platform-apps-release]
  pull_request:

permissions:
  contents: read

env:
  RELEASE_TAG: v0.1.0

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build desktop executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .
          python -c "import tkinter; import cosmos_bio_cns; print(cosmos_bio_cns.__version__)"
          pyinstaller --noconfirm --clean --onefile --windowed --name COSMOS-Bio-CNS --collect-data cosmos_bio_cns apps/desktop/main.py
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/COSMOS-Bio-CNS.exe release/COSMOS-Bio-CNS-Windows-x64-portable.exe

      - name: Build one-click installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\windows\setup.iss"
          if (!(Test-Path "release\COSMOS-Bio-CNS-Setup-Windows-x64.exe")) { throw "installer missing" }
          if (!(Test-Path "release\COSMOS-Bio-CNS-Windows-x64-portable.exe")) { throw "portable exe missing" }

      - name: Upload Windows binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-windows
          path: |
            release/COSMOS-Bio-CNS-Setup-Windows-x64.exe
            release/COSMOS-Bio-CNS-Windows-x64-portable.exe
          if-no-files-found: error

  macos:
    name: macOS DMG and app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build app bundle and DMG
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -e .
          python -c "import tkinter; import cosmos_bio_cns; print(cosmos_bio_cns.__version__)"
          pyinstaller --noconfirm --clean --windowed --name "COSMOS Bio CNS" --collect-data cosmos_bio_cns apps/desktop/main.py
          codesign --force --deep --sign - "dist/COSMOS Bio CNS.app"
          codesign --verify --deep --strict "dist/COSMOS Bio CNS.app"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/COSMOS Bio CNS.app" "release/COSMOS-Bio-CNS-macOS-x64.app.zip"
          hdiutil create -volname "COSMOS Bio CNS" -srcfolder "dist/COSMOS Bio CNS.app" -ov -format UDZO "release/COSMOS-Bio-CNS-macOS-x64.dmg"
          test -s "release/COSMOS-Bio-CNS-macOS-x64.dmg"
          test -s "release/COSMOS-Bio-CNS-macOS-x64.app.zip"

      - name: Upload macOS binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-macos
          path: |
            release/COSMOS-Bio-CNS-macOS-x64.dmg
            release/COSMOS-Bio-CNS-macOS-x64.app.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          gradle-version: "8.13"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Build Android application
        run: |
          gradle -p apps/android --no-daemon :app:assembleDebug
          mkdir -p release
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release/COSMOS-Bio-CNS-Android-debug.apk
          test -s release/COSMOS-Bio-CNS-Android-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-android
          path: release/COSMOS-Bio-CNS-Android-debug.apk
          if-no-files-found: error

  ios:
    name: iOS app build
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version
          xcodebuild -version

      - name: Generate and build iOS app
        run: |
          cd apps/ios
          xcodegen generate
          xcodebuild \
            -project CosmosBioCNS.xcodeproj \
            -scheme CosmosBioCNS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          cd ../..
          APP_PATH=$(find apps/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/COSMOS-Bio-CNS-iOS-Simulator.app.zip"
          test -s "release/COSMOS-Bio-CNS-iOS-Simulator.app.zip"

      - name: Upload iOS app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-ios
          path: release/COSMOS-Bio-CNS-iOS-Simulator.app.zip
          if-no-files-found: error

  python-package:
    name: Python wheel and source package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Upload Python packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  release:
    name: Package GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [windows, macos, android, ios, python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: release-bundle
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or refresh v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "COSMOS Bio/CNS v0.1.0" \
              --notes "Verified v0.1.0 platform release: Windows installer + portable EXE, macOS DMG + app bundle, Android APK, iOS Simulator app build, Python wheel/source package, and SHA-256 checksums. iOS physical-device/App Store signing and macOS notarization require the distributor's Apple credentials."
          fi
          mapfile -d '' files < <(find release-bundle -type f -print0)
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
