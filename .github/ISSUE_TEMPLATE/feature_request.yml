name: Feature request
description: Propose an adapter, integration, test, or engineering improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What integration or engineering need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed interface or behavior
      description: Describe inputs, outputs, units, quality semantics, and failure behavior where relevant.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Human-data/privacy considerations
      description: Explain consent, retention, raw-data, or deployment implications. Write None if not applicable.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How should it be tested?
      description: Define a reproducible success criterion and relevant controls.
