name: Bug report
description: Report a reproducible problem in the Bio/CNS integration library
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sensor adapter
        - Baseline/fusion
        - Local CNS
        - Persistence/heartbeat
        - HTTP bridge
        - Azure transport
        - Packaging/installation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized code/data only. Never post secrets or private human biosignal records.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, device/sensor type, and relevant optional extras.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personally identifying data, and private raw biosignal/media data.
          required: true
