[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-bio-cns"
version = "0.1.0"
description = "Local-first bio-signal to CNS integration toolkit derived from the COSMOS/CST engineering lineage."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Cory Shane Davis"}]
keywords = ["biosignals", "multimodal", "cns", "adaptive-state", "edge-ai", "cosmos", "cst"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
azure = ["azure-iot-device", "azure-eventhub", "azure-identity"]
dev = ["build", "twine"]

[project.scripts]
cosmos-bio-cns = "cosmos_bio_cns.cli:main"

[project.urls]
Homepage = "https://github.com/NavisWORLD/Bio-integration-pipeline-"
Repository = "https://github.com/NavisWORLD/Bio-integration-pipeline-"
Research = "https://doi.org/10.5281/zenodo.17574447"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosmos_bio_cns = ["py.typed", "schemas/*.json"]
