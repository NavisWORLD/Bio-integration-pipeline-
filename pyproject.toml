[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmos-bio-cns"
version = "0.3.0"
description = "Local-first bio-signal to CNS integration toolkit with cross-language synaptic SDKs derived from the COSMOS/CST engineering lineage."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Cory-Davis-Bio-CNS-Rights-Reservation-1.0"
license-files = ["LICENSE", "LICENSE_HISTORY.md", "LICENSE-DOCS.md"]
authors = [{name = "Cory Shane Davis"}]
keywords = ["biosignals", "multimodal", "cns", "adaptive-state", "edge-ai", "cosmos", "cst", "rust", "cpp", "ffi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
azure = ["azure-iot-device", "azure-eventhub", "azure-identity"]
dev = ["build", "twine"]

[project.scripts]
cosmos-bio-cns = "cosmos_bio_cns.cli:main"

[project.urls]
Homepage = "https://github.com/NavisWORLD/Bio-integration-pipeline-"
Repository = "https://github.com/NavisWORLD/Bio-integration-pipeline-"
Research = "https://doi.org/10.5281/zenodo.17574447"
Rights = "https://github.com/NavisWORLD/Bio-integration-pipeline-/blob/main/LICENSE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cosmos_bio_cns = ["py.typed", "schemas/*.json"]
